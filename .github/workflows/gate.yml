name: gate
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 第 28 单：涨号铁律门禁的第二层要求 HEAD 与 main 的分叉点、
          # 以及反向自查要拿的六个历史 merge 提交都在本地可达。
          # actions/checkout 默认 fetch-depth: 1（浅克隆）时两者都取不到，
          # 那道闸会退化成「只剩第一层 + 合成场景」并如实印 SKIP，不会静默变绿。
          fetch-depth: 0
      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 提取内联脚本
        run: |
          python3 - <<'EOF'
          import re
          m=re.search(r'<script>([\s\S]*)</script>',open('city-life-framework.html').read())
          open('app.js','w').write(m.group(1))
          EOF
      - name: 语法检查
        run: node --check app.js
      - name: 无头模拟测试
        run: node harness.js
      - name: 30 天退化检查
        run: node sim30.js
      - name: 走位三铁律门禁（第 20 单）
        run: node walkgate.js
      - name: 中转函数语法检查
        run: |
          cp functions/relay.js relay-check.mjs
          node --check relay-check.mjs
      - name: 涨号铁律门禁（第 28 单）
        env:
          # PR 事件下把基线 sha 直接交给门禁；push: main 时为空，门禁自行退回 merge-base。
          VERSIONGATE_BASE: ${{ github.event.pull_request.base.sha }}
        run: node versiongate.js
      - name: SIM 块纯净检查
        run: |
          python3 - <<'EOF'
          import re
          s=open('city-life-framework.html').read()
          m=re.search(r'/\*SIM-START\*/([\s\S]*?)/\*SIM-END\*/',s)
          assert m, 'SIM 标记缺失'
          assert 'Math.random' not in m.group(1), 'SIM 块内发现 Math.random'
          print('SIM 纯净')
          EOF
